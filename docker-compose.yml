# 生产级 RAG 知识库 - 一键部署
# 用法：
#   cp .env.example .env        # 可选：填 LLM Key 开启完整问答
#   docker compose up -d        # 启动
#   docker compose logs -f      # 看日志
#   浏览器打开 http://localhost:8000 （演示页）
services:
  rag-kb:
    build: .
    image: rag-knowledge-base:latest
    container_name: rag-knowledge-base
    ports:
      - "8000:8000"
    environment:
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - HF_HOME=/app/.hf
    volumes:
      - hf_cache:/app/.hf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s

volumes:
  hf_cache:
